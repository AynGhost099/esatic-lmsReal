services:
  - type: web
    name: esatic-lms
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements/base.txt && pip install gunicorn && python manage.py collectstatic --noinput --settings=config.settings.prod && python manage.py migrate --settings=config.settings.prod"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: esatic-lms-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.11"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DEBUG
        value: "False"

databases:
  - name: esatic-lms-db
    plan: free
